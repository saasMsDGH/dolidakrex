name: DOLIDAKREX image
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile.dakrex
      - source.lock.json
      - .dockerignore
      - .github/workflows/dakrex.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: dolidakrex-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    if: github.repository == 'saasMsDGH/dolidakrex'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Read immutable source revision
        id: source
        run: |
          python3 - <<'PY'
          import json, os, re
          source = json.load(open('source.lock.json'))
          assert source['repository'] == 'saasMsDGH/doli'
          assert re.fullmatch('[0-9a-f]{40}', source['revision'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('revision=' + source['revision'] + '\n')
          PY
      - name: Checkout Doli fork
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: saasMsDGH/doli
          ref: ${{ steps.source.outputs.revision }}
          path: doli
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build fork and publish
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile.dakrex
          platforms: linux/amd64
          push: true
          tags: ghcr.io/saasmsdgh/dolidakrex:build-${{ github.sha }}
          build-args: |
            DOLI_SOURCE_REV=${{ steps.source.outputs.revision }}
            DAKREX_BUILD_REV=${{ github.sha }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deployment reference
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          SOURCE_REVISION: ${{ steps.source.outputs.revision }}
        run: |
          printf 'Image: ghcr.io/saasmsdgh/dolidakrex@%s\nSource: saasMsDGH/doli@%s\n' "$IMAGE_DIGEST" "$SOURCE_REVISION" >> "$GITHUB_STEP_SUMMARY"
